# dsh-workspace-envrc bundle patch: register the workspaceEnvrc provider and
# the Host integration row for Agent-owned Bash and workspace stdio MCP.
#
# The personal Web distribution declares overlay before envrc. The rows
# require overlay's workspaceCordis service, workspace MCP manager, and
# public method-wrapper. The host must already provide a working `direnv`
# executable; neither row installs direnv nor runs `direnv allow`.
#
# The provider row states every deployed value explicitly because a patch row
# replaces the whole config. Persistent terminals are intentionally unsupported:
# DSH mounts their service inside preset-private realms, while this bundle is a
# Host profile layer. See docs/adr/0001-no-persistent-shell.md.
- insert:
    - id: workspace-envrc
      name: dsh-workspace-envrc
      config:
        executable: direnv
        shimShell: /bin/bash
        enableBash: true
        enableWorkspaceMcp: true
        versionCheckTimeoutMs: 5000
    - id: workspace-envrc-integration
      name: dsh-workspace-envrc/integration-plugin
