# dsh-workspace-envrc bundle patch: register the workspaceEnvrc provider and
# the integration row that wires its execution adapters.
#
# Block A ships the provider core. Block B adds the reversible Bash adapter;
# Block C adds the persistent-terminal adapter (operation-local AsyncLocalStorage
# over ctx.terminals.spawn, wrapping the ctx.sandbox.confine argv commit seam or
# the ctx.subprocess.spawnTerminal spec argv with the deferred managed-env
# wrapper). Both are installed by the single workspace-envrc-integration row
# below (the row injects agents/shell/sandbox/subprocess/terminals/workspaceEnvrc,
# installs Bash first then Terminal inside one effect, and reverse-disposes
# terminal-first then Bash on fiber unload; a failing Terminal install rolls
# back the already-installed Bash adapter).
#
# The provider row's config states the full deployed values explicitly (a
# patch row replaces the target row's whole config, never a deep merge) so
# `dsh --dump-config` shows every field even though they equal the schema
# defaults.
- insert:
    - id: workspace-envrc
      name: dsh-workspace-envrc
      config:
        executable: direnv
        shimShell: /bin/bash
        enableBash: true
        enableTerminal: true
        versionCheckTimeoutMs: 5000
    - id: workspace-envrc-integration
      name: dsh-workspace-envrc/integration-plugin
