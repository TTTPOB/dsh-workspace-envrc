# dsh-workspace-envrc bundle patch: register the workspaceEnvrc provider row.
#
# Block A ships the provider core only. The row's config states the full
# deployed values explicitly (a patch row replaces the target row's whole
# config, never a deep merge) so `dsh --dump-config` shows every field even
# though they equal the schema defaults. The reversible Bash adapter and the
# persistent-terminal adapter are later blocks; their integration rows will be
# inserted here once wired, keeping this Block A bundle loadable on its own.
- insert:
    - id: workspace-envrc
      name: dsh-workspace-envrc
      config:
        executable: direnv
        shimShell: /bin/bash
        enableBash: true
        enableTerminal: true
        versionCheckTimeoutMs: 5000
